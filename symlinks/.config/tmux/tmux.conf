set -s escape-time 0
set -g mode-keys vi
set -g status-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g pane-border-indicators arrows
set -g allow-passthrough on                     # OCS 8 links
set -a terminal-features ',*:RGB:hyperlinks'    # imgs?
set -a terminal-overrides ',foot*:Tc'           # imgs?
set -g default-terminal "tmux-direct"           # imgs?
set -g prefix C-w
set -g status-right-length 45
set -ag status-right ' #(cat /sys/class/power_supply/macsmc-battery/capacity)%%'
unbind C-b
unbind n
unbind p
bind C-w send-prefix
bind -N 'Spread panes out evenly' e select-layout -E
bind -N 'Zoom the active pane' C-z resizep -Z
bind ` join-pane -t !
bind -T copy-mode-vi y send -X copy-selection
# https://github.com/tmux-plugins/tmux-pain-control
bind h    select-pane  -L
bind C-h  select-pane  -L
bind j    select-pane  -D
bind C-j  select-pane  -D
bind k    select-pane  -U
bind C-k  select-pane  -U
bind l    select-pane  -R
bind C-l  select-pane  -R
bind -r H resize-pane  -L 5
bind -r J resize-pane  -D 5
bind -r K resize-pane  -U 5
bind -r L resize-pane  -R 5
bind |    split-window -fh -c "#{pane_current_path}"
bind \\   split-window -fh -c "#{pane_current_path}"
bind -    split-window -fv -c "#{pane_current_path}"
bind _    split-window -fv -c "#{pane_current_path}"
bind %    split-window -fh -c "#{pane_current_path}"
bind '"'  split-window -fv -c "#{pane_current_path}"
bind c    new-window       -c "#{pane_current_path}"
set -g @jump-key S
set -g @jump-key-case 'smartcase'
set -g @fingers-jump-key C-s
run tmux-fingers.tmux
run tmux-jump.tmux
run extrakto.tmux
